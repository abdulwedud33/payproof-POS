# Gitleaks configuration for PayProof POS
title = "PayProof POS Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''^\.env\.example$''',
  '''^package(-lock)?\.json$''',
  '''^pnpm-lock\.yaml$''',
  '''^docs/''',
  '''\.md$''',
  '''node_modules''',
  '''dist''',
  '''\.git'''
]
regexes = [
  '''CHANGE_ME''',
  '''CHANGE_ME_LONG_RANDOM''',
  '''7F3K'''
]
